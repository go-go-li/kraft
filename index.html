<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krafttraining-Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kraft">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f5fbf">
<style>
:root{--bg:#e9ecef;--card:#f7f8f9;--ink:#1a1e23;--mute:#5d6670;--line:#cfd5db;--plate:#1f5fbf;--pr:#d9a400;--onplate:#fff;--bad:#b3261e;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2126;--ink:#eceff2;--mute:#9aa3ad;--line:#30363d;--plate:#5b9bff;--pr:#f0be2a;--onplate:#0d1b33;--bad:#ff8a80}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 -apple-system,"Helvetica Neue",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font:800 38px/1 "Avenir Next Condensed","Arial Narrow",Impact,sans-serif;margin:8px 0 4px}
.sub{margin:0 0 20px;color:var(--mute)}
.add{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:14px;color:var(--mute);min-width:0}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;width:100%;min-width:0}
input[hidden]{display:none}
select{appearance:auto}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row label:last-child{grid-column:1/-1}
.primary{font:700 18px "Avenir Next Condensed","Arial Narrow",sans-serif;background:var(--plate);color:var(--onplate);border:0;border-radius:6px;padding:12px;cursor:pointer}
.primary:disabled{opacity:.45;cursor:not-allowed}
.empty{color:var(--mute);margin:28px 4px}
.list{display:grid;gap:12px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.head{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;padding:14px;cursor:pointer}
.head:focus-visible{outline:3px solid var(--plate);outline-offset:-3px}
.name{font:800 24px/1.1 "Avenir Next Condensed","Arial Narrow",sans-serif}
.last{color:var(--mute);font-size:14px}
.big{grid-row:1/3;grid-column:2;text-align:right;font:800 52px/1 "Avenir Next Condensed","Arial Narrow",sans-serif;color:var(--plate)}
.big small{font-size:18px;color:var(--mute);margin-left:3px}
.meta{display:flex;gap:16px;padding:0 14px 10px;font-size:14px;color:var(--mute)}
.meta b{color:var(--ink)}
.up{color:var(--plate)}.down{color:var(--bad)}
svg.spark{display:block;width:calc(100% - 28px);height:40px;margin:0 14px 14px}
.hist{border-top:1px solid var(--line);padding:6px 14px 10px;margin:0;list-style:none}
.hist li{display:grid;grid-template-columns:56px 1fr 14px auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pr)}
.del{all:unset;cursor:pointer;color:var(--mute);font-size:14px;padding:4px 6px;border-radius:4px}
.del:focus-visible{outline:3px solid var(--plate)}
.gh{font:800 22px/1.1 "Avenir Next Condensed","Arial Narrow",sans-serif;margin:14px 2px 0}
.gh span{font:500 16px -apple-system,system-ui,sans-serif;color:var(--mute);margin-left:4px}
.assign{padding:0 14px 12px}
.fig{display:block;width:100%;max-width:170px;height:auto;margin:0 auto}
.figwrap{padding:0 14px 8px}
#preview:empty{display:none}
.wrap{padding-bottom:96px}
.meta{flex-wrap:wrap;align-items:center}
.mini{font:600 14px -apple-system,system-ui,sans-serif;background:transparent;color:var(--plate);border:1px solid var(--plate);border-radius:6px;padding:4px 10px;cursor:pointer}
.meta .mini{margin-left:auto}
.hist small{display:block;color:var(--mute)}
.del+.del{margin-left:6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 3px;text-align:center;min-height:64px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wd.today{border-color:var(--plate);box-shadow:0 0 0 1px var(--plate)}
.wd b{font-size:13px}.wd small{font-size:11px;color:var(--mute)}
.pl{font-size:10.5px;line-height:1.15;border-radius:4px;padding:2px;word-break:break-word}
.pl.ok{background:var(--plate);color:var(--onplate)}
.pl.todo{border:1px solid var(--plate);color:var(--plate)}
.pl.miss{border:1px dashed var(--mute);color:var(--mute)}
.log li{grid-template-columns:76px 1fr}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 8px;padding:6px 12px}
legend{font-weight:600;padding:0 4px}
.chk{display:flex;gap:8px;align-items:center;font-size:16px;color:var(--ink);padding:3px 0}
.chk input{width:auto}
.plan h3{font:800 22px/1.1 "Avenir Next Condensed","Arial Narrow",sans-serif;margin:12px 14px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 8px}
.chip{font:600 15px -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
.chip.done{border-color:var(--plate);color:var(--plate)}
.acts{display:flex;gap:8px;padding:0 14px 12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpis b{display:block;font:800 30px/1 "Avenir Next Condensed","Arial Narrow",sans-serif;color:var(--plate)}
.kpis span{font-size:14px;color:var(--mute)}
svg.wk{display:block;width:100%;height:80px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.gbar{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;font-size:14px}
.gbar i{display:block;height:10px;border-radius:5px;background:var(--plate)}
.gbar em{font-style:normal;color:var(--mute)}
#timer{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--plate);color:var(--onplate);border-radius:10px;padding:10px 14px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#timer[hidden]{display:none}
#timer b{font:800 28px "Avenir Next Condensed","Arial Narrow",sans-serif;margin-right:auto}
#timer button{font:600 14px -apple-system,system-ui,sans-serif;background:transparent;color:var(--onplate);border:1px solid var(--onplate);border-radius:6px;padding:5px 10px;cursor:pointer}
.backup{margin-top:28px;display:grid;gap:10px}
.backup h2{font:800 22px/1.1 "Avenir Next Condensed","Arial Narrow",sans-serif;margin:0}
.backup p{margin:0;color:var(--mute);font-size:14px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{font:600 16px -apple-system,system-ui,sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:11px;cursor:pointer}
#msg{min-height:1.4em;color:var(--plate);font-size:14px}
fieldset+fieldset{margin-top:0}
.fld{display:grid;gap:4px;font-size:14px;color:var(--mute);min-width:0}
.step{display:grid;grid-template-columns:48px 1fr 48px;gap:6px}
.step button{all:unset;box-sizing:border-box;min-height:48px;text-align:center;font:700 26px/46px -apple-system,sans-serif;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--plate);cursor:pointer;user-select:none}
.step button:active{background:var(--line)}
.step button:focus-visible{outline:3px solid var(--plate)}
.step input{text-align:center;font-size:20px;font-weight:600}
input,select{min-height:48px}
.primary{min-height:54px;font-size:20px}
.sec{min-height:48px}
.mini{padding:9px 14px;font-size:15px}
.del{padding:10px 8px;font-size:15px}
.chip{padding:10px 14px}
.head{padding:16px 14px}
.wrap{padding-bottom:120px}
.todayplan{background:var(--card);border:1px solid var(--plate);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.pl.free{background:var(--line);color:var(--ink)}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{all:unset;box-sizing:border-box;display:grid;gap:2px;align-content:center;min-height:56px;text-align:center;font-size:11px;font-weight:600;color:var(--mute);cursor:pointer}
#tabs button.on{color:var(--plate)}
#tabs button:focus-visible{outline:3px solid var(--plate);outline-offset:-3px}
#tabs .ic{font-size:21px;line-height:1}
#timer{bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:6}
[data-tab]{display:none}
body[data-t="train"] [data-tab="train"],body[data-t="plans"] [data-tab="plans"],body[data-t="list"] [data-tab="list"],body[data-t="stats"] [data-tab="stats"],body[data-t="data"] [data-tab="data"]{display:grid}
body[data-t="train"] #todaybox:empty{display:none}
.meta{gap:4px 16px}
.mrow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.mrow small{color:var(--mute)}
.macts{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Krafttraining</h1>
  <p class="sub" id="sub"></p>

  <div id="todaybox" data-tab="train"></div>

  <section class="add" data-tab="train" aria-label="Neuen Satz erfassen">
    <label>Muskelgruppe
      <select id="grp"></select>
    </label>
    <label>Übung
      <select id="exsel"></select>
      <input id="exnew" placeholder="Name der neuen Übung" autocomplete="off" hidden>
    </label>
    <div id="preview"></div>
    <div class="row">
      <div class="fld"><span>Gewicht (kg)</span><div class="step"><button type="button" data-step="kg:-2.5" aria-label="2,5 kg weniger">−</button><input id="kg" type="number" inputmode="decimal" step="0.5" min="0" aria-label="Gewicht in kg"><button type="button" data-step="kg:2.5" aria-label="2,5 kg mehr">+</button></div></div>
      <div class="fld"><span>Wiederholungen</span><div class="step"><button type="button" data-step="reps:-1" aria-label="Eine weniger">−</button><input id="reps" type="number" inputmode="numeric" step="1" min="1" aria-label="Wiederholungen"><button type="button" data-step="reps:1" aria-label="Eine mehr">+</button></div></div>
      <label>Datum<input id="date" type="date"></label>
    </div>
    <label>Notiz (optional)<input id="note" placeholder="z. B. letzter Satz schwer" autocomplete="off"></label>
    <button class="primary" id="save" disabled>Satz speichern</button>
  </section>

  <section class="backup" data-tab="plans" aria-label="Trainingspläne">
    <h2>Trainingspläne</h2>
    <div id="plansbox" style="display:grid;gap:12px"></div>
  </section>

  <button class="sec" id="gomanage" data-tab="list" style="width:100%;margin-bottom:12px">Übungen verwalten</button>
  <div id="list" class="list" data-tab="list"></div>

  <section class="backup" data-tab="stats" aria-label="Auswertung">
    <h2>Auswertung</h2>
    <label>Zeitraum<select id="per"><option value="4">Letzte 4 Wochen</option><option value="12">Letzte 12 Wochen</option><option value="0">Alles</option></select></label>
    <div id="statbox" style="display:grid;gap:10px"></div>
  </section>

  <section class="backup" data-tab="data" id="managebox" aria-label="Übungen verwalten">
    <h2>Übungen verwalten</h2>
    <p>Hier legst du Übungen an, benennst sie um, änderst die Muskelgruppe oder löschst sie.</p>
    <div style="display:grid;gap:8px"><select id="mgrpnew" aria-label="Muskelgruppe"></select><input id="mname" placeholder="Name der neuen Übung" autocomplete="off"><button class="sec" id="madd" type="button">Übung anlegen</button></div>
    <div id="mlist" style="display:grid;gap:8px"></div>
  </section>

  <section class="backup" data-tab="data" aria-label="Datensicherung">
    <h2>Datensicherung</h2>
    <p>Deine Daten liegen nur auf diesem Gerät. Sichere sie ab und zu als Datei.</p>
    <div class="btns">
      <button class="sec" id="export">Daten sichern</button>
      <button class="sec" id="import">Daten laden</button>
      <button class="sec" id="csv">CSV exportieren</button>
    </div>
    <input id="file" type="file" accept="application/json,.json" hidden>
    <div id="msg" role="status"></div>
    <p id="ver" style="font-size:13px"></p>
  </section>
</div>

<nav id="tabs" aria-label="Bereiche">
  <button data-go="train"><span class="ic">✏️</span>Training</button>
  <button data-go="plans"><span class="ic">📅</span>Pläne</button>
  <button data-go="list"><span class="ic">📋</span>Übungen</button>
  <button data-go="stats"><span class="ic">📈</span>Auswertung</button>
  <button data-go="data"><span class="ic">💾</span>Daten</button>
</nav>

<div id="timer" hidden role="timer"><span>Pause</span><b id="tleft">1:30</b><button id="tadd">+15 s</button><button id="tstop">Stopp</button></div>

<script>
var KEY = 'krafttraining-v1';
var NEW = '__new';
var NONE = 'Ohne Gruppe';
var GROUPS = ['Brust', 'Rücken', 'Schultern', 'Bizeps', 'Trizeps', 'Beine', 'Gesäß', 'Bauch'];
var CATALOG = {
  'Brust': ['Bankdrücken', 'Schrägbankdrücken', 'Kurzhantel-Bankdrücken', 'Fliegende', 'Brustpresse', 'Dips'],
  'Rücken': ['Klimmzüge', 'Latziehen', 'Rudern', 'Kabelrudern', 'Kreuzheben', 'Rückenstrecker'],
  'Schultern': ['Schulterdrücken', 'Seitheben', 'Frontheben', 'Face Pulls', 'Reverse Fly', 'Arnold Press'],
  'Bizeps': ['Langhantel-Curls', 'Kurzhantel-Curls', 'Hammer-Curls', 'Scott-Curls', 'Kabel-Curls'],
  'Trizeps': ['Trizepsdrücken', 'Französisches Drücken', 'Enges Bankdrücken', 'Overhead-Trizepsstrecken', 'Kickbacks'],
  'Beine': ['Kniebeuge', 'Beinpresse', 'Ausfallschritte', 'Rumänisches Kreuzheben', 'Beinstrecker', 'Beinbeuger', 'Wadenheben'],
  'Gesäß': ['Hip Thrust', 'Glute Bridge', 'Bulgarische Kniebeuge', 'Kabel-Kickbacks', 'Abduktoren-Maschine'],
  'Bauch': ['Crunches', 'Cable Crunch', 'Beinheben hängend', 'Russian Twist', 'Bauchrad']
};
function catalogGroup(ex) {
  var l = ex.toLowerCase();
  for (var i = 0; i < GROUPS.length; i++) {
    if (CATALOG[GROUPS[i]].some(function (n) { return n.toLowerCase() === l; })) return GROUPS[i];
  }
  return '';
}
function cleanGrp(g) { return GROUPS.indexOf(g) > -1 ? g : ''; }
var $ = function (s) { return document.querySelector(s); };
var today = function () { return new Date().toISOString().slice(0, 10); };
var entries = [], open = null;
try { var r = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(r)) entries = r; } catch (e) {}

function save() { try { localStorage.setItem(KEY, JSON.stringify(entries)); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmt(n) { return Number(n).toLocaleString('de-DE', { maximumFractionDigits: 2 }); }
function day(d) { var p = d.split('-'); return p[2] + '.' + p[1] + '.'; }
function say(t) { $('#msg').textContent = t; }

// ---- Animierte Strichfiguren: je Übung eine Start- und eine Endposition ----
var ANIM = {"squat": {"label": "Kniebeuge", "bar": true, "decor": [], "a": {"h": [80, 10], "n": [80, 19], "p": [78, 48], "e": [68, 34], "w": [76, 22], "k": [80, 76], "f": [78, 108], "b": [77, 22]}, "b": {"h": [85, 48], "n": [80, 58], "p": [66, 86], "e": [70, 70], "w": [77, 60], "k": [96, 84], "f": [74, 108], "b": [77, 60]}}, "bench": {"label": "Bankdrücken", "bar": true, "decor": [[30, 84, 100, 84], [38, 84, 38, 108], [96, 84, 96, 108]], "a": {"h": [40, 76], "n": [50, 78], "p": [88, 78], "e": [51, 62], "w": [52, 46], "k": [110, 72], "f": [116, 104], "b": [52, 46]}, "b": {"h": [40, 76], "n": [50, 78], "p": [88, 78], "e": [62, 72], "w": [52, 66], "k": [110, 72], "f": [116, 104], "b": [52, 66]}}, "dead": {"label": "Kreuzheben", "bar": true, "decor": [], "a": {"h": [99, 52], "n": [92, 58], "p": [64, 76], "e": [88, 78], "w": [84, 99], "k": [92, 84], "f": [80, 108], "b": [84, 99]}, "b": {"h": [80, 10], "n": [80, 19], "p": [78, 48], "e": [81, 36], "w": [82, 52], "k": [80, 76], "f": [80, 108], "b": [82, 52]}}, "press": {"label": "Schulterdrücken", "bar": true, "decor": [], "a": {"h": [80, 10], "n": [80, 19], "p": [78, 48], "e": [74, 34], "w": [83, 20], "k": [80, 76], "f": [78, 108], "b": [83, 20]}, "b": {"h": [80, 10], "n": [80, 19], "p": [78, 48], "e": [81, 3], "w": [82, -13], "k": [80, 76], "f": [78, 108], "b": [82, -13]}}, "pull": {"label": "Klimmzüge", "bar": false, "decor": [[40, -20, 120, -20], [40, -20, 40, 108], [120, -20, 120, 108]], "a": {"h": [80, 5], "n": [80, 14], "p": [80, 44], "e": [80, -2], "w": [80, -20], "k": [80, 72], "f": [72, 96]}, "b": {"h": [81, -18], "n": [80, -8], "p": [80, 22], "e": [90, -6], "w": [80, -20], "k": [80, 50], "f": [72, 74]}}};
var ANIM_NAMES = { 'kniebeuge': 'squat', 'bankdrücken': 'bench', 'kreuzheben': 'dead', 'schulterdrücken': 'press', 'klimmzüge': 'pull' };
function animKey(ex) { return ANIM_NAMES[String(ex || '').toLowerCase()] || ''; }
function pt(a) { return a[0].toFixed(1) + ' ' + a[1].toFixed(1); }
function figSvg(key) {
  var a = ANIM[key], st = 'fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"';
  var ln = 'stroke="var(--line)" stroke-width="3" stroke-linecap="round"';
  var h = '<svg class="fig" data-fig="' + key + '" viewBox="0 -34 160 154" role="img" aria-label="Animation: ' + a.label + '">';
  h += '<line x1="10" y1="108" x2="150" y2="108" ' + ln + '/>';
  a.decor.forEach(function (l) { h += '<line x1="' + l[0] + '" y1="' + l[1] + '" x2="' + l[2] + '" y2="' + l[3] + '" ' + ln + '/>'; });
  h += '<path class="torso" ' + st + '/><path class="leg" ' + st + '/><path class="arm" ' + st + '/>';
  h += '<circle class="head" r="7" fill="var(--card)" stroke="var(--ink)" stroke-width="4"/>';
  if (a.bar) h += '<circle class="bar" r="9" fill="var(--plate)"/>';
  return h + '</svg>';
}
function lerp(p, q, u) { return [p[0] + (q[0] - p[0]) * u, p[1] + (q[1] - p[1]) * u]; }
function setPose(svg, u) {
  var a = ANIM[svg.dataset.fig], P = {};
  ['h', 'n', 'p', 'e', 'w', 'k', 'f', 'b'].forEach(function (k) { if (a.a[k]) P[k] = lerp(a.a[k], a.b[k], u); });
  svg.querySelector('.torso').setAttribute('d', 'M' + pt(P.n) + 'L' + pt(P.p));
  svg.querySelector('.leg').setAttribute('d', 'M' + pt(P.p) + 'L' + pt(P.k) + 'L' + pt(P.f));
  svg.querySelector('.arm').setAttribute('d', 'M' + pt(P.n) + 'L' + pt(P.e) + 'L' + pt(P.w));
  var hd = svg.querySelector('.head'); hd.setAttribute('cx', P.h[0]); hd.setAttribute('cy', P.h[1]);
  var b = svg.querySelector('.bar'); if (b && P.b) { b.setAttribute('cx', P.b[0]); b.setAttribute('cy', P.b[1]); }
}
var raf = null, t0 = performance.now();
var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function applyAll(u) { document.querySelectorAll('svg.fig').forEach(function (s) { setPose(s, u); }); }
function tick(now) {
  if (!document.querySelector('svg.fig')) { raf = null; return; }
  var x = 0.5 - 0.5 * Math.cos((now - t0) * 2 * Math.PI / 3200);
  applyAll(x * x * (3 - 2 * x));
  raf = requestAnimationFrame(tick);
}
function startAnim() {
  applyAll(0);
  if (!still && !raf && document.querySelector('svg.fig')) raf = requestAnimationFrame(tick);
}

function groups() {
  var map = {};
  entries.forEach(function (e) { (map[e.ex] = map[e.ex] || []).push(e); });
  return Object.keys(map).map(function (ex) {
    var asc = map[ex].slice().sort(function (a, b) { return a.date.localeCompare(b.date) || a.id - b.id; });
    var best = -Infinity;
    var marked = asc.map(function (e) { var pr = e.kg > best; best = Math.max(best, e.kg); return { id: e.id, kg: e.kg, reps: e.reps, date: e.date, note: e.note || '', pr: pr }; });
    var last = marked[marked.length - 1], prev = marked[marked.length - 2];
    var e1 = Math.max.apply(null, marked.map(function (e) { return e.reps === 1 ? e.kg : e.kg * (1 + e.reps / 30); }));
    var withG = asc.filter(function (e) { return cleanGrp(e.grp); });
    var grp = withG.length ? cleanGrp(withG[withG.length - 1].grp) : catalogGroup(ex);
    var rec = marked.slice(-12), kgs = rec.map(function (e) { return e.kg; });
    var min = Math.min.apply(null, kgs), max = Math.max.apply(null, kgs);
    var points = rec.length < 2 ? null : rec.map(function (e, i) {
      var x = i / (rec.length - 1) * 200;
      var y = max === min ? 20 : 36 - (e.kg - min) / (max - min) * 32;
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    return { ex: ex, grp: grp, e1: e1, last: last, pr: best, delta: prev ? last.kg - prev.kg : null, points: points, desc: marked.slice().reverse() };
  }).sort(function (a, b) { return b.last.date.localeCompare(a.last.date) || b.last.id - a.last.id; });
}

function rowAction(t) {
  if (t.dataset.again) {
    var g = groups().filter(function (x) { return x.ex === t.dataset.again; })[0];
    if (g) { entries.push({ id: Date.now(), ex: g.ex, grp: g.grp, kg: g.last.kg, reps: g.last.reps, note: '', date: today() }); startRest(); }
  } else if (t.dataset.edit) {
    var id = Number(t.dataset.edit), e = entries.filter(function (x) { return x.id === id; })[0];
    if (!e) return;
    var kg = prompt('Gewicht (kg)', e.kg); if (kg === null) return;
    var reps = prompt('Wiederholungen', e.reps); if (reps === null) return;
    var note = prompt('Notiz', e.note || ''); if (note === null) return;
    kg = Number(String(kg).replace(',', '.')); reps = Number(reps);
    if (!(kg >= 0) || !(reps >= 1)) return;
    e.kg = kg; e.reps = reps; e.note = note.trim();
  } else if (t.dataset.rename) {
    var old = t.dataset.rename, nn = prompt('Neuer Name', old);
    if (!nn || !nn.trim()) return;
    nn = nn.trim();
    var m = groups().filter(function (x) { return x.ex.toLowerCase() === nn.toLowerCase() && x.ex !== old; })[0];
    if (m) nn = m.ex;
    entries.forEach(function (x) { if (x.ex === old) x.ex = nn; });
    if (open === old) open = nn;
    plans.forEach(function (p) { p.exs = p.exs.map(function (n) { return n === old ? nn : n; }); }); savePlans();
    customs.forEach(function (c) { if (c.ex === old) c.ex = nn; }); saveCustoms();
  }
  save(); renderSelect($('#exsel').value); render(); check();
}
$('#list').addEventListener('click', function (ev) {

    var id = Number(del.dataset.del);
    entries = entries.filter(function (e) { return e.id !== id; });
    save(); renderSelect($('#exsel').value); render(); check(); return;
  }

var PKEY = 'krafttraining-plans-v1', plans = [], pedit = null;
try { var pr = JSON.parse(localStorage.getItem(PKEY)); if (Array.isArray(pr)) plans = pr; } catch (e) {}
var CKEY = 'krafttraining-custom-v1', customs = [];
try { var cr = JSON.parse(localStorage.getItem(CKEY)); if (Array.isArray(cr)) customs = cr.filter(function (c) { return c && typeof c.ex === 'string'; }); } catch (e) {}
function saveCustoms() { try { localStorage.setItem(CKEY, JSON.stringify(customs)); } catch (e) {} }
// Vorschläge einer Muskelgruppe: feste Liste plus eigene Übungen, ohne bereits benutzte
function suggest(g, seen) {
  var out = [], dup = {};
  (CATALOG[g] || []).concat(customs.filter(function (c) { return c.grp === g; }).map(function (c) { return c.ex; })).forEach(function (n) {
    var l = n.toLowerCase(); if (!seen[l] && !dup[l]) { dup[l] = 1; out.push(n); }
  });
  return out;
}
function knownEx(nm) {
  var l = nm.toLowerCase(), r = '';
  groups().forEach(function (g) { if (g.ex.toLowerCase() === l) r = g.ex; });
  customs.forEach(function (c) { if (!r && c.ex.toLowerCase() === l) r = c.ex; });
  GROUPS.forEach(function (g) { CATALOG[g].forEach(function (n) { if (!r && n.toLowerCase() === l) r = n; }); });
  return r;
}

    '<option value=""' + (sel === '' ? ' selected' : '') + '>' + NONE + '</option></select>' +

}

var WD = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
function wdx(ds) { return (new Date(ds + 'T00:00:00').getDay() + 6) % 7; }
function dayMap() { var m = {}; entries.forEach(function (e) { (m[e.date] = m[e.date] || {})[e.ex] = 1; }); return m; }
// Ein Plan gilt als trainiert, wenn mindestens die Hälfte seiner Übungen an dem Tag einen Satz hat
function planStat(p, ds, m) {
  var t = p.exs.length, d = m[ds]; if (!t || !d) return null;
  var n = p.exs.filter(function (x) { return d[x]; }).length;
  return { n: n, t: t, ok: n >= Math.ceil(t / 2) };
}
function planned() { var o = {}; plans.forEach(function (p) { p.exs.forEach(function (x) { o[x] = 1; }); }); return o; }
function freeN(ds, m, inP) { return Object.keys(m[ds] || {}).filter(function (x) { return !inP[x]; }).length; }
function lastDone(p, m) { var best = ''; Object.keys(m).forEach(function (ds) { var st = planStat(p, ds, m); if (st && st.ok && ds > best) best = ds; }); return best; }
function planInfo(p, m) {
  var ld = lastDone(p, m);
  return (p.days && p.days.length ? 'Geplant: ' + p.days.slice().sort().map(function (i) { return WD[i]; }).join(', ') : 'Nicht eingeplant') + '. ' +
    (ld ? 'Zuletzt trainiert: ' + WD[wdx(ld)] + ' ' + day(ld) : 'Noch nicht trainiert');

  }).join('') + '</fieldset>';
}
function renderWeek(m) {
  var d0 = new Date(weekStart(today()) + 'T00:00:00'), t = today(), inP = planned(), h = '<p class="cap">Diese Woche</p><div class="week">';
  for (var i = 0; i < 7; i++) {
    var d = new Date(d0); d.setDate(d.getDate() + i);
    var ds = iso(d), cells = '';
    plans.forEach(function (p) {
      var st = planStat(p, ds, m), ok = st && st.ok, planned = (p.days || []).indexOf(i) > -1;
      if (!planned && !ok) return;
      cells += '<span class="pl ' + (ok ? 'ok' : ds < t ? 'miss' : 'todo') + '">' + (ok ? '✓ ' : '') + esc(p.name) + '</span>';
    });
    var fn = freeN(ds, m, inP); if (fn) cells += '<span class="pl free">Frei ' + fn + '</span>';
    h += '<div class="wd' + (ds === t ? ' today' : '') + '"><b>' + WD[i] + '</b><small>' + ds.slice(8) + '</small>' + cells + '</div>';
  }

}
function renderLog(m) {

  Object.keys(m).sort().reverse().forEach(function (ds) {

    var parts = [];
    plans.forEach(function (p) { var st = planStat(p, ds, m); if (st && st.ok) parts.push(esc(p.name) + ' (' + st.n + '/' + st.t + ')'); });

}

function pickEx(ex) { go('train'); $('#grp').value = exGroup(ex); renderSelect(ex); prefill(); check(); }
function renderToday() {

    h += '<div class="todayplan"><b>Heute geplant: ' + esc(p.name) + '</b><div class="chips" style="padding:8px 0 0">' + p.exs.map(function (n) {
      return '<button class="chip' + (d[n] ? ' done' : '') + '" data-pex="' + esc(n) + '">' + (d[n] ? '✓ ' : '') + esc(n) + '</button>';
    }).join('') + '</div></div>';
  });
  $('#todaybox').innerHTML = h;
}
$('#todaybox').addEventListener('click', function (ev) { var b = ev.target.closest('[data-pex]'); if (b) pickEx(b.dataset.pex); });
function go(t) {
  document.body.dataset.t = t;
  try { localStorage.setItem('krafttraining-tab', t); } catch (e) {}
  document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.go === t); });
  window.scrollTo(0, 0);
}
$('#tabs').addEventListener('click', function (ev) { var b = ev.target.closest('[data-go]'); if (b) go(b.dataset.go); });
document.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-step]'); if (!b) return;
  var p = b.dataset.step.split(':'), inp = $('#' + p[0]), v = Number(String(inp.value).replace(',', '.')) || 0;
  inp.value = Math.max(p[0] === 'reps' ? 1 : 0, Math.round((v + Number(p[1])) * 100) / 100); check();
});
var VERSION = '10';
function grpOpts(cur) {
  return GROUPS.map(function (g) { return '<option value="' + g + '"' + (g === cur ? ' selected' : '') + '>' + g + '</option>'; }).join('') +
    '<option value=""' + (cur === '' ? ' selected' : '') + '>' + NONE + '</option>';
}
function refreshAll() { renderSelect($('#exsel').value); render(); check(); }
function renderManage() {
  if (!$('#mgrpnew').options.length) $('#mgrpnew').innerHTML = grpOpts('Brust');
  var names = {};
  groups().forEach(function (g) { names[g.ex] = { grp: g.grp, n: g.desc.length }; });
  customs.forEach(function (c) { if (!names[c.ex]) names[c.ex] = { grp: c.grp, n: 0 }; });
  var h = '';
  GROUPS.concat(['']).forEach(function (g) {
    var list = Object.keys(names).filter(function (k) { return names[k].grp === g; }).sort(function (a, b) { return a.localeCompare(b, 'de'); });
    if (!list.length) return;
    h += '<p class="cap">' + (g || NONE) + '</p>' + list.map(function (k) {
      var n = names[k].n;
      return '<div class="mrow"><div><b>' + esc(k) + '</b> <small>' + (n ? n + (n === 1 ? ' Satz' : ' Sätze') : 'noch keine Sätze') + '</small></div>' +
        '<div class="macts"><select data-mgrp="' + esc(k) + '" aria-label="Muskelgruppe von ' + esc(k) + '">' + grpOpts(names[k].grp) + '</select>' +
        '<button class="mini" data-mren="' + esc(k) + '">Umbenennen</button><button class="mini" data-mdel="' + esc(k) + '">Löschen</button></div></div>';
    }).join('');
  });
  $('#mlist').innerHTML = h || '<p>Noch keine Übungen.</p>';
}
function delEx(ex) {
  var n = entries.filter(function (e) { return e.ex === ex; }).length;
  var inP = plans.filter(function (p) { return p.exs.indexOf(ex) > -1; }).length;
  var msg = n ? 'Zu „' + ex + '“ gehören ' + n + (n === 1 ? ' Satz' : ' Sätze') + '. Übung und alle Sätze löschen?' : 'Übung „' + ex + '“ löschen?';
  if (inP) msg += ' Sie wird auch aus ' + inP + (inP === 1 ? ' Plan' : ' Plänen') + ' entfernt.';
  if (!confirm(msg)) return;
  entries = entries.filter(function (e) { return e.ex !== ex; });
  customs = customs.filter(function (c) { return c.ex !== ex; });
  plans.forEach(function (p) { p.exs = p.exs.filter(function (x) { return x !== ex; }); });
  if (open === ex) open = null;
  save(); saveCustoms(); savePlans(); refreshAll(); renderToday();
}
$('#managebox').addEventListener('click', function (ev) {
  var b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.mren) { rowAction({ dataset: { rename: b.dataset.mren } }); renderToday(); }
  else if (b.dataset.mdel) delEx(b.dataset.mdel);
  else if (b.id === 'madd') {
    var nm = $('#mname').value.trim(); if (!nm) return;
    var ex0 = knownEx(nm);
    if (ex0) { say('„' + ex0 + '“ gibt es schon.'); return; }
    customs.push({ ex: nm, grp: $('#mgrpnew').value }); saveCustoms();
    $('#mname').value = ''; say('„' + nm + '“ hinzugefügt.'); refreshAll();
  }
});
$('#managebox').addEventListener('change', function (ev) {
  var sel = ev.target.closest('[data-mgrp]'); if (!sel) return;
  var ex = sel.dataset.mgrp, v = sel.value;
  entries.forEach(function (e) { if (e.ex === ex) e.grp = v; });
  customs.forEach(function (c) { if (c.ex === ex) c.grp = v; });
  save(); saveCustoms(); refreshAll();
});
$('#gomanage').addEventListener('click', function () { go('data'); $('#managebox').scrollIntoView(); });
$('#ver').textContent = 'App-Version ' + VERSION;
function renderPlans() {
  var box = $('#plansbox');
  if (pedit) {
    if (box.querySelector('#pname')) return;
    var all = groups(), seen = {}, h = '<label>Name<input id="pname" value="' + esc(pedit.name) + '" placeholder="z. B. Push" autocomplete="off"></label>' + dayBoxes(pedit.days) + addBox(pedit.agrp === undefined ? 'Brust' : pedit.agrp);
    all.forEach(function (x) { seen[x.ex.toLowerCase()] = 1; });
    GROUPS.concat(['']).forEach(function (g) {
      var names = all.filter(function (x) { return x.grp === g; }).map(function (x) { return x.ex; });
      suggest(g, seen).forEach(function (n) { names.push(n); });
      if (!names.length) return;
      h += '<fieldset><legend>' + (g || NONE) + '</legend>' + names.map(function (n) {
        return '<label class="chk"><input type="checkbox" value="' + esc(n) + '"' + (pedit.exs.indexOf(n) > -1 ? ' checked' : '') + '> ' + esc(n) + '</label>';
      }).join('') + '</fieldset>';
    });
    box.innerHTML = h + '<div class="btns"><button class="primary" id="psave">Plan speichern</button><button class="sec" id="pcancel">Abbrechen</button></div>';
    return;
  }
  var m = dayMap();
  var list = plans.map(function (p) {
    var chips = p.exs.map(function (n) {
      var done = entries.some(function (e) { return e.ex === n && e.date === today(); });
      return '<button class="chip' + (done ? ' done' : '') + '" data-pex="' + esc(n) + '">' + (done ? '✓ ' : '') + esc(n) + '</button>';
    }).join('');
    return '<article class="card plan"><h3>' + esc(p.name) + '</h3><div class="last" style="padding:0 14px 8px">' + planInfo(p, m) + '</div><div class="chips">' + (chips || '<span class="last">Keine Übungen</span>') +
      '</div><div class="acts"><button class="mini" data-pedit="' + p.id + '">Bearbeiten</button><button class="mini" data-pdel="' + p.id + '">Löschen</button></div></article>';
  }).join('');
  box.innerHTML = renderWeek(m) + (plans.length ? list : '<p>Noch kein Plan. Lege z. B. Push, Pull und Beine an. Ein Tipp auf eine Übung im Plan wählt sie oben zum Eintragen aus.</p>') + renderLog(m) +
    '<button class="sec" id="newplan">+ Neuer Plan</button>';
}
$('#plansbox').addEventListener('click', function (ev) {
  var b = ev.target.closest('button'); if (!b) return;
  var box = $('#plansbox');
  if (b.dataset.pex) { pickEx(b.dataset.pex); return; }
  if (b.id === 'newplan') { pedit = { id: 0, name: '', exs: [], days: [] }; box.innerHTML = ''; }
  else if (b.dataset.pedit) {
    var p = plans.filter(function (x) { return x.id === Number(b.dataset.pedit); })[0];
    if (!p) return; pedit = { id: p.id, name: p.name, exs: p.exs.slice(), days: (p.days || []).slice() }; box.innerHTML = '';
  }
  else if (b.dataset.pdel) {
    if (!confirm('Plan löschen? Deine Sätze bleiben erhalten.')) return;
    plans = plans.filter(function (x) { return x.id !== Number(b.dataset.pdel); }); savePlans();
  }
  else if (b.id === 'psave') {
    var exs = [].map.call(box.querySelectorAll('input[type=checkbox]:not(.wdc):checked'), function (c) { return c.value; });
    var days = [].map.call(box.querySelectorAll('.wdc:checked'), function (c) { return Number(c.value); });
    var name = $('#pname').value.trim() || 'Plan ' + (plans.length + 1);
    if (pedit.id) plans.forEach(function (x) { if (x.id === pedit.id) { x.name = name; x.exs = exs; x.days = days; } });
    else plans.push({ id: Date.now(), name: name, exs: exs, days: days });
    savePlans(); pedit = null;
  }
  else if (b.id === 'paddex') {
    syncEdit();
    var nm = $('#pnewex').value.trim();
    if (nm) {
      var ex0 = knownEx(nm);
      if (!ex0) { customs.push({ ex: nm, grp: pedit.agrp }); saveCustoms(); ex0 = nm; }
      if (pedit.exs.indexOf(ex0) < 0) pedit.exs.push(ex0);
    }
    box.innerHTML = '';
  }
  else if (b.id === 'pcancel') { pedit = null; }
  else return;
  renderPlans(); renderToday(); renderSelect($('#exsel').value);
});

function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function weekStart(s) { var d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); }
function renderStats() {
  var box = $('#statbox'), wk = Number($('#per').value);
  if (!entries.length) { box.innerHTML = '<p>Noch keine Daten.</p>'; return; }
  var weeks = wk || 12, d0 = new Date(weekStart(today()) + 'T00:00:00'), keys = [];
  for (var i = weeks - 1; i >= 0; i--) { var d = new Date(d0); d.setDate(d.getDate() - i * 7); keys.push(iso(d)); }
  var cut = wk ? keys[0] : '', gs = groups(), gm = {};
  gs.forEach(function (g) { gm[g.ex] = g.grp; });
  var inp = entries.filter(function (e) { return e.date >= cut; });
  var vol = 0, days = {}, byG = {}, byW = {};
  inp.forEach(function (e) {
    var v = e.kg * e.reps, g = gm[e.ex] || '', w = weekStart(e.date);
    vol += v; days[e.date] = 1; byG[g] = (byG[g] || 0) + v; byW[w] = (byW[w] || 0) + v;
  });
  var prs = 0;
  gs.forEach(function (g) { g.desc.forEach(function (e, i) { if (e.pr && i < g.desc.length - 1 && e.date >= cut) prs++; }); });
  var vals = keys.map(function (k) { return byW[k] || 0; }), max = Math.max.apply(null, vals);
  var h = '<div class="kpis">' + [[Object.keys(days).length, 'Trainingstage'], [inp.length, 'Sätze'], [fmt(Math.round(vol)), 'Volumen (kg)'], [prs, 'Bestleistungen']]
    .map(function (k) { return '<div><b>' + k[0] + '</b><span>' + k[1] + '</span></div>'; }).join('') + '</div>';
  if (max > 0) {
    var bw = 200 / keys.length;
    h += '<p class="cap">Volumen pro Woche (älteste links), Spitze ' + fmt(Math.round(max)) + ' kg</p><svg class="wk" viewBox="0 0 200 64" preserveAspectRatio="none" aria-hidden="true">' +
      vals.map(function (v, i) {
        var hh = Math.max(v / max * 60, v ? 2 : 0.8);
        return '<rect x="' + (i * bw + 1).toFixed(1) + '" y="' + (62 - hh).toFixed(1) + '" width="' + Math.max(bw - 2, 1).toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="1.5" fill="var(--plate)" opacity="' + (v ? 1 : 0.25) + '"/>';
      }).join('') + '</svg>';
  }
  var gk = Object.keys(byG).sort(function (a, b) { return byG[b] - byG[a]; });
  if (gk.length && byG[gk[0]] > 0) {
    h += '<p class="cap">Volumen je Muskelgruppe</p>' + gk.map(function (k) {
      return '<div class="gbar"><span>' + (k || NONE) + '</span><i style="width:' + (byG[k] / byG[gk[0]] * 100).toFixed(0) + '%"></i><em>' + fmt(Math.round(byG[k])) + ' kg</em></div>';
    }).join('');
  }
  box.innerHTML = h;
}
$('#per').addEventListener('change', renderStats);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}

$('#date').value = today();
var first = groups()[0];
var tb = 'train'; try { tb = localStorage.getItem('krafttraining-tab') || 'train'; } catch (e) {}
go(['train', 'plans', 'list', 'stats', 'data'].indexOf(tb) > -1 ? tb : 'train');
renderGroupSelect(first ? first.grp : GROUPS[0]);
renderSelect('');
render();
check();
</script>
