@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2126;--ink:#eceff2;--mute:#9aa3ad;--line:#30363d;--plate:#5b9bff;--pr:#f0be2a;--onplate:#0d1b33;--bad:#ff8a80}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 -apple-system,"Helvetica Neue",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font:800 38px/1 "Avenir Next Condensed","Arial Narrow",Impact,sans-serif;margin:8px 0 4px}
.sub{margin:0 0 20px;color:var(--mute)}
.add{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:14px;color:var(--mute);min-width:0}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;width:100%;min-width:0}
input[hidden]{display:none}
select{appearance:auto}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row label:last-child{grid-column:1/-1}
.primary{font:700 18px "Avenir Next Condensed","Arial Narrow",sans-serif;background:var(--plate);color:var(--onplate);border:0;border-radius:6px;padding:12px;cursor:pointer}

.empty{color:var(--mute);margin:28px 4px}
.list{display:grid;gap:12px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.head{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;padding:14px;cursor:pointer}
.head:focus-visible{outline:3px solid var(--plate);outline-offset:-3px}
.name{font:800 24px/1.1 "Avenir Next Condensed","Arial Narrow",sans-serif}
.last{color:var(--mute);font-size:14px}
.big{grid-row:1/3;grid-column:2;text-align:right;font:800 52px/1 "Avenir Next Condensed","Arial Narrow",sans-serif;color:var(--plate)}
.big small{font-size:18px;color:var(--mute);margin-left:3px}
.meta{display:flex;gap:16px;padding:0 14px 10px;font-size:14px;color:var(--mute)}
.meta b{color:var(--ink)}
.up{color:var(--plate)}.down{color:var(--bad)}
svg.spark{display:block;width:calc(100% - 28px);height:40px;margin:0 14px 14px}
.hist{border-top:1px solid var(--line);padding:6px 14px 10px;margin:0;list-style:none}
.hist li{display:grid;grid-template-columns:56px 1fr 14px auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--pr)}
.del{all:unset;cursor:pointer;color:var(--mute);font-size:14px;padding:4px 6px;border-radius:4px}
.del:focus-visible{outline:3px solid var(--plate)}
.gh{font:800 22px/1.1 "Avenir Next Condensed","Arial Narrow",sans-serif;margin:14px 2px 0}
.gh span{font:500 16px -apple-system,system-ui,sans-serif;color:var(--mute);margin-left:4px}
.assign{padding:0 14px 12px}
.fig{display:block;width:100%;max-width:170px;height:auto;margin:0 auto}
.figwrap{padding:0 14px 8px}
#preview:empty{display:none}
.wrap{padding-bottom:96px}
.meta{flex-wrap:wrap;align-items:center}
.mini{font:600 14px -apple-system,system-ui,sans-serif;background:transparent;color:var(--plate);border:1px solid var(--plate);border-radius:6px;padding:4px 10px;cursor:pointer}
.meta .mini{margin-left:auto}
.hist small{display:block;color:var(--mute)}
.del+.del{margin-left:6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 3px;text-align:center;min-height:64px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wd.today{border-color:var(--plate);box-shadow:0 0 0 1px var(--plate)}
.wd b{font-size:13px}.wd small{font-size:11px;color:var(--mute)}
.pl{font-size:10.5px;line-height:1.15;border-radius:4px;padding:2px;word-break:break-word}
.pl.ok{background:var(--plate);color:var(--onplate)}
.pl.todo{border:1px solid var(--plate);color:var(--plate)}
.pl.miss{border:1px dashed var(--mute);color:var(--mute)}
.log li{grid-template-columns:76px 1fr}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 8px;padding:6px 12px}
legend{font-weight:600;padding:0 4px}
.chk{display:flex;gap:8px;align-items:center;font-size:16px;color:var(--ink);padding:3px 0}
.chk input{width:auto}
.plan h3{font:800 22px/1.1 "Avenir Next Condensed","Arial Narrow",sans-serif;margin:12px 14px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 8px}
.chip{font:600 15px -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
.chip.done{border-color:var(--plate);color:var(--plate)}
.acts{display:flex;gap:8px;padding:0 14px 12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpis b{display:block;font:800 30px/1 "Avenir Next Condensed","Arial Narrow",sans-serif;color:var(--plate)}
.kpis span{font-size:14px;color:var(--mute)}
svg.wk{display:block;width:100%;height:80px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.gbar{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;font-size:14px}
.gbar i{display:block;height:10px;border-radius:5px;background:var(--plate)}
.gbar em{font-style:normal;color:var(--mute)}
#timer{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--plate);color:var(--onplate);border-radius:10px;padding:10px 14px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#timer[hidden]{display:none}
#timer b{font:800 28px "Avenir Next Condensed","Arial Narrow",sans-serif;margin-right:auto}
#timer button{font:600 14px -apple-system,system-ui,sans-serif;background:transparent;color:var(--onplate);border:1px solid var(--onplate);border-radius:6px;padding:5px 10px;cursor:pointer}
.backup{margin-top:28px;display:grid;gap:10px}
.backup h2{font:800 22px/1.1 "Avenir Next Condensed","Arial Narrow",sans-serif;margin:0}
.backup p{margin:0;color:var(--mute);font-size:14px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec{font:600 16px -apple-system,system-ui,sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:11px;cursor:pointer}
#msg{min-height:1.4em;color:var(--plate);font-size:14px}
fieldset+fieldset{margin-top:0}
.fld{display:grid;gap:4px;font-size:14px;color:var(--mute);min-width:0}
.step{display:grid;grid-template-columns:48px 1fr 48px;gap:6px}
.step button{all:unset;box-sizing:border-box;min-height:48px;text-align:center;font:700 26px/46px -apple-system,sans-serif;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--plate);cursor:pointer;user-select:none}
.step button:active{background:var(--line)}
.step button:focus-visible{outline:3px solid var(--plate)}
.step input{text-align:center;font-size:20px;font-weight:600}
input,select{min-height:48px}
.primary{min-height:54px;font-size:20px}
.sec{min-height:48px}
.mini{padding:9px 14px;font-size:15px}
.del{padding:10px 8px;font-size:15px}
.chip{padding:10px 14px}
.head{padding:16px 14px}
.wrap{padding-bottom:120px}
.todayplan{background:var(--card);border:1px solid var(--plate);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.pl.free{background:var(--line);color:var(--ink)}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{all:unset;box-sizing:border-box;display:grid;gap:2px;align-content:center;min-height:56px;text-align:center;font-size:10.5px;font-weight:600;color:var(--mute);cursor:pointer}
#tabs button.on{color:var(--plate)}
#tabs button:focus-visible{outline:3px solid var(--plate);outline-offset:-3px}
#tabs .ic{font-size:21px;line-height:1}
#timer{bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:6}
[data-tab]{display:none}
body[data-t="train"] [data-tab="train"],body[data-t="plans"] [data-tab="plans"],body[data-t="list"] [data-tab="list"],body[data-t="stats"] [data-tab="stats"],body[data-t="data"] [data-tab="data"]{display:grid}
body[data-t="train"] #todaybox:empty{display:none}
.meta{gap:4px 16px}
.mrow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.mrow small{color:var(--mute)}
.macts{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}

/* ---- Modernes Design: Farben, Karten, Typografie, Navigation ---- */
:root{--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--mute:#6c6c70;--line:#dcdce2;--plate:#1f5fbf;--tint:#e6eefb;--onplate:#fff;--glass:rgba(255,255,255,.82);--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.05);--r:16px}

.add,.card,.todayplan,.mrow,.kpis div,.wd,svg.wk{border:0;border-radius:var(--r);box-shadow:var(--shadow)}
.todayplan{border:1.5px solid var(--plate)}
.wd.today{box-shadow:0 0 0 2px var(--plate)}
.add{padding:16px;gap:14px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;background:var(--line);border-radius:12px}
.seg button{all:unset;box-sizing:border-box;text-align:center;padding:10px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg button:focus-visible{outline:2px solid var(--plate)}
#tabs{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:.5px solid var(--line);padding-top:6px}

#tabs .ic svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on .ic{background:var(--tint)}
#timer{border-radius:16px}
body[data-t] [data-tab]{animation:fin .2s ease-out}
.step{grid-template-columns:42px 1fr 42px;gap:5px}
.step input{padding:0;font-size:19px}
.row label:last-child{grid-column:auto}

.mhead{display:flex;align-items:center;gap:12px}.mhead b{font-size:20px}

.ch{margin:0!important}

:root[data-theme="light"]{--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--mute:#6c6c70;--line:#dcdce2;--plate:#1f5fbf;--tint:#e6eefb;--onplate:#fff;--glass:rgba(255,255,255,.82);--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.05);--pr:#d9a400;--bad:#b3261e;color-scheme:light}

.gtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:4;background:var(--bg);padding:8px 0;margin:-8px 0 0}
.gtabs::-webkit-scrollbar,.pager::-webkit-scrollbar{display:none}
.gtabs button{all:unset;box-sizing:border-box;flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.gtabs button.on{background:var(--plate);color:var(--onplate)}
.gtabs small{opacity:.7;margin-left:2px}
.gtabs button:focus-visible{outline:2px solid var(--plate)}
.pager{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;align-items:flex-start;margin:0 -4px;padding:4px}
.page{flex:0 0 100%;box-sizing:border-box;min-width:0;scroll-snap-align:start;display:grid;gap:12px;align-content:start}
.ptop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec.on{background:var(--plate);color:var(--onplate)}
.carousel>.card{flex:0 0 100%;box-sizing:border-box;scroll-snap-align:center}
.carousel{align-items:flex-start}
.fbar{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);padding:10px;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.18);margin-top:8px}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.sw{all:unset;box-sizing:border-box;position:relative;width:40px;height:40px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.14)}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
.sw:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
.sw input{position:absolute;inset:0;width:100%;height:100%;min-height:0;padding:0;border:0;opacity:0;cursor:pointer}
#topbar #logo>rect{fill:var(--plate)}
#topbar #logo>g{fill:var(--onplate)}

/* ===== Design 3.0: Verläufe, Glas, Tiefe, weiche Bewegung ===== */
:root{--plate-rgb:31,95,191;--hair:rgba(0,0,0,.07);--r:24px;--shadow:0 1px 1px rgba(0,0,0,.04),0 10px 28px -10px rgba(20,30,60,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--plate-rgb:106,166,255;--hair:rgba(255,255,255,.09);--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 30px -10px rgba(0,0,0,.7)}}
:root[data-theme="light"]{--plate-rgb:31,95,191;--hair:rgba(0,0,0,.07);--shadow:0 1px 1px rgba(0,0,0,.04),0 10px 28px -10px rgba(20,30,60,.16)}
:root[data-theme="dark"]{--plate-rgb:106,166,255;--hair:rgba(255,255,255,.09);--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 30px -10px rgba(0,0,0,.7)}
*{-webkit-tap-highlight-color:transparent}
button,[role=button]{touch-action:manipulation}
body::before{background:radial-gradient(90% 38% at 85% -6%,rgba(var(--plate-rgb),.2),transparent 70%),radial-gradient(70% 30% at -10% 105%,rgba(var(--plate-rgb),.1),transparent 70%)}
.wrap{padding:68px 18px 150px}
.add,.card,.todayplan,.mrow,.kpis div,.wd,svg.wk,.st,.collapsible{border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow)}
.card,.st,.add{background-image:linear-gradient(180deg,rgba(var(--plate-rgb),.055),rgba(var(--plate-rgb),0) 55%)}
.todayplan{border:1px solid rgba(var(--plate-rgb),.45);background:linear-gradient(135deg,rgba(var(--plate-rgb),.14),rgba(var(--plate-rgb),.04)),var(--card)}
.add{padding:20px;gap:16px}
input,select{border:1px solid transparent;border-radius:14px;background:rgba(120,120,128,.11);transition:box-shadow .2s,background .2s}
input:focus,select:focus{outline:none;box-shadow:0 0 0 4px rgba(var(--plate-rgb),.22);background:rgba(120,120,128,.07)}
label,.fld{font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--mute)}
input,select{font-weight:500}
.step button,.plusbtn{border:0;border-radius:14px;background:rgba(var(--plate-rgb),.12);color:var(--plate)}
.primary{border-radius:18px;background:linear-gradient(135deg,var(--plate),rgba(var(--plate-rgb),.8));color:var(--onplate);box-shadow:0 12px 24px -10px rgba(var(--plate-rgb),.65),inset 0 1px 0 rgba(255,255,255,.28)}
.primary:disabled{opacity:.4;box-shadow:none}
.sec,.mini,.pen,.chip{background:rgba(var(--plate-rgb),.11);color:var(--plate)}
.sec{border-radius:16px}
.chip.done{background:var(--plate);color:var(--onplate)}
.name{font-size:22px;font-weight:700;letter-spacing:-.025em}
.big,.kpis b{font-weight:800;letter-spacing:-.045em;background:linear-gradient(135deg,var(--plate),rgba(var(--plate-rgb),.6));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.big{font-size:56px}
.big small{-webkit-text-fill-color:var(--mute);color:var(--mute);letter-spacing:0}
.wd{border-radius:18px}
.wd.sel{background:linear-gradient(180deg,rgba(var(--plate-rgb),.2),rgba(var(--plate-rgb),.06)),var(--card);box-shadow:0 0 0 1.5px var(--plate),var(--shadow)}
.wd.today b{color:var(--plate)}
.seg{padding:4px;border-radius:16px;background:rgba(120,120,128,.14)}
.seg button{border-radius:12px;padding:11px 4px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.14)}
.gtabs button{border:1px solid var(--hair);background:var(--card);color:var(--ink)}
.gtabs button.on{background:var(--plate);color:var(--onplate);border-color:transparent;box-shadow:0 8px 18px -8px rgba(var(--plate-rgb),.7)}
.bar{height:10px;border-radius:6px;background:var(--hair)}
.bar i{border-radius:6px;background:linear-gradient(90deg,rgba(var(--plate-rgb),.65),var(--plate));box-shadow:0 0 14px rgba(var(--plate-rgb),.55)}
.medal{position:relative;box-shadow:0 8px 16px -6px rgba(0,0,0,.4),inset 0 -3px 0 rgba(0,0,0,.18)}
.medal::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.42),rgba(255,255,255,0) 55%)}
.dots button.on{box-shadow:0 0 10px rgba(var(--plate-rgb),.6)}
.collapsible .mrow{background:rgba(120,120,128,.08);box-shadow:none;border-color:transparent}
.hist li{border-color:var(--hair)}
#topbar{border-bottom:0;box-shadow:0 1px 0 var(--hair);-webkit-backdrop-filter:saturate(200%) blur(24px);backdrop-filter:saturate(200%) blur(24px)}
#topbar button{background:rgba(var(--plate-rgb),.11);color:var(--ink)}
#topbar #logo{filter:drop-shadow(0 4px 10px rgba(var(--plate-rgb),.45))}
#tabs{border:1px solid var(--hair);border-radius:30px;-webkit-backdrop-filter:saturate(200%) blur(26px);backdrop-filter:saturate(200%) blur(26px);box-shadow:0 18px 40px -12px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.06)}
#tabs button.on{background:transparent;color:var(--plate)}
#tabs .ic{width:54px;height:32px;border-radius:16px}
#tabs button.on .ic{background:rgba(var(--plate-rgb),.16)}
#timer,#toast{border-radius:22px;background:linear-gradient(135deg,var(--plate),rgba(var(--plate-rgb),.82));box-shadow:0 16px 32px -12px rgba(var(--plate-rgb),.7)}
.fbar{border:1px solid var(--hair);border-radius:24px}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.page>.card,#plansbox>.card,.carousel>.st{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.page>.card:nth-child(2),#plansbox>.card:nth-child(2){animation-delay:.05s}
.page>.card:nth-child(3){animation-delay:.1s}
.page>.card:nth-child(n+4){animation-delay:.15s}
body[data-t] [data-tab]{animation:fin .32s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.page>.card,#plansbox>.card,.carousel>.st{animation:none}}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){body[data-t] [data-tab]{animation:none}*{transition:none!important}}

/* ---- Design 2.0: Glas, Tiefe, weiche Flächen, schwebende Navigation ---- */
:root{--bd:rgba(15,23,42,.07);--shadow:0 1px 1px rgba(16,24,40,.04),0 10px 28px -10px rgba(16,24,40,.16);--r:22px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bd:rgba(255,255,255,.08);--shadow:0 10px 30px -12px rgba(0,0,0,.65)}}
:root[data-theme="light"]{--bd:rgba(15,23,42,.07);--shadow:0 1px 1px rgba(16,24,40,.04),0 10px 28px -10px rgba(16,24,40,.16)}
:root[data-theme="dark"]{--bd:rgba(255,255,255,.08);--shadow:0 10px 30px -12px rgba(0,0,0,.65)}
html{background:var(--bg)}
body{background:transparent;letter-spacing:-.005em}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(110% 55% at 100% -5%,var(--tint),transparent 60%),radial-gradient(90% 45% at -10% 105%,var(--tint),transparent 65%)}
.add,.card,.mrow,.kpis div,.wd,svg.wk,.st,.collapsible,.gtabs button,.chipst{border:1px solid var(--bd)}
.wrap{padding-bottom:150px}
#topbar{border-bottom:1px solid var(--bd)}
#tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;gap:2px;border:1px solid var(--bd);border-radius:28px;box-shadow:0 14px 34px -10px rgba(0,0,0,.3);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
#tabs button{min-height:52px;border-radius:22px;transition:background .2s,color .2s}
#tabs button.on{background:var(--tint)}
#tabs button.on .ic{background:transparent}
#timer{bottom:calc(92px + env(safe-area-inset-bottom,0px));border:1px solid rgba(255,255,255,.2);box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
.fbar{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:14px}
input:focus-visible,select:focus-visible{outline:none;border-color:var(--plate);box-shadow:0 0 0 4px var(--tint)}
.step button{border:1px solid var(--bd);border-radius:14px}
.primary{border-radius:18px;min-height:56px;letter-spacing:-.01em}
.sec{border-radius:16px}
.seg{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:4px}
.seg button{border-radius:12px}
.seg button.on{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12),0 4px 10px -4px rgba(0,0,0,.2)}
.st{border-radius:24px}
.st.big2{background:linear-gradient(150deg,var(--tint),var(--card) 62%)}
.medal{box-shadow:0 8px 18px -6px rgba(0,0,0,.4),inset 0 -3px 0 rgba(0,0,0,.2),inset 0 2px 0 rgba(255,255,255,.35)}
.big{font-size:56px;letter-spacing:-.03em}
.kpis b{font-size:34px;letter-spacing:-.03em}
.wd{border-radius:16px}
.card,.add,.mrow,.st{transition:transform .15s ease,box-shadow .2s ease}
@supports (background:color-mix(in srgb,red,blue)){
  .primary{background:linear-gradient(180deg,color-mix(in srgb,var(--plate) 80%,#fff),var(--plate));box-shadow:0 12px 24px -10px color-mix(in srgb,var(--plate) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
  .primary:disabled{box-shadow:none}
  #timer{background:linear-gradient(180deg,color-mix(in srgb,var(--plate) 85%,#fff),var(--plate))}
}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="ttl">Training</h1>
  <p class="sub" id="sub"></p>

  <div id="stchip" data-tab="train"></div>

  <div id="todaybox" data-tab="train"></div>

  <section class="add" data-tab="train" aria-label="Neuen Satz erfassen">
    <label>Muskelgruppe
      <select id="grp"></select>
    </label>
    <div class="fld"><span>Übung</span><div class="exrow"><select id="exsel" aria-label="Übung"></select><button type="button" id="plus" class="plusbtn" aria-label="Eigene Übung hinzufügen">+</button></div><input id="exnew" placeholder="Name der neuen Übung" autocomplete="off" hidden></div>
    <div id="preview"></div>
    <div class="row">
      <div class="fld"><span id="wlabel">Gewicht (kg)</span><div class="step"><button type="button" id="wminus" data-step="kg:-2.5" aria-label="Gewicht verringern">−</button><input id="kg" type="number" inputmode="decimal" step="0.5" min="0" aria-label="Gewicht"><button type="button" id="wplus" data-step="kg:2.5" aria-label="Gewicht erhöhen">+</button></div></div>
      <div class="fld"><span>Wiederholungen</span><div class="step"><button type="button" data-step="reps:-1" aria-label="Eine weniger">−</button><input id="reps" type="number" inputmode="numeric" step="1" min="1" aria-label="Wiederholungen"><button type="button" data-step="reps:1" aria-label="Eine mehr">+</button></div></div>
      <label>Datum<input id="date" type="date"></label>
      <label>Notiz<input id="note" placeholder="optional" autocomplete="off"></label>
    </div>
    <button class="primary" id="save" disabled>Satz speichern</button>
  </section>

  <section class="backup" data-tab="plans" aria-label="Trainingspläne">
    <div id="plansbox" style="display:grid;gap:12px"></div>
  </section>

  <div id="list" class="list" data-tab="list"></div>

  <section class="backup" data-tab="stats" aria-label="Status">
    <div id="statusbody" style="display:grid;gap:10px"></div>
  </section>

  <section class="backup" data-tab="stats" aria-label="Auswertung">
    <div class="seg" id="per" data-v="4" role="group" aria-label="Zeitraum"><button data-v="4" class="on">4 Wochen</button><button data-v="12">12 Wochen</button><button data-v="0">Alles</button></div>
    <div id="statbox" style="display:grid;gap:10px"></div>
  </section>

  <section class="backup collapsible" data-tab="data" aria-label="Einheit">
    <h2>Einheit</h2>
    <div class="seg" id="unitseg" style="grid-template-columns:1fr 1fr"><button data-unit="kg">Kilogramm (kg)</button><button data-unit="lb">Pfund (lb)</button></div>
  </section>

  <section class="backup collapsible collapsed" data-tab="data" id="managebox" aria-label="Übungen verwalten">
    <h2 class="ch"><button type="button" class="chb" aria-expanded="false" data-coll="managebox">Übungen verwalten<span class="chev" aria-hidden="true"></span></button></h2>
    <p>Tippe auf den Stift einer Muskelgruppe, um ihre Übungen zu bearbeiten oder neue hinzuzufügen.</p>
    <div id="mlist" style="display:grid;gap:8px"></div>
  </section>

  <section class="backup collapsible collapsed" data-tab="data" id="backupbox" aria-label="Datensicherung">
    <h2 class="ch"><button type="button" class="chb" aria-expanded="false" data-coll="backupbox">Datensicherung<span class="chev" aria-hidden="true"></span></button></h2>
    <p>Deine Daten liegen nur auf diesem Gerät. Sichere sie ab und zu als Datei.</p>
    <div class="btns">
      <button class="sec" id="export">Daten sichern</button>
      <button class="sec" id="import">Daten laden</button>
      <button class="sec" id="csv">CSV exportieren</button>
    </div>
    <input id="file" type="file" accept="application/json,.json" hidden>
    <div id="msg" role="status"></div>
  </section>

  <section class="backup collapsible collapsed" data-tab="data" id="designbox" aria-label="Design">
    <h2 class="ch"><button type="button" class="chb" aria-expanded="false" data-coll="designbox">Design<span class="chev" aria-hidden="true"></span></button></h2>
    <p class="cap">Akzentfarbe</p>
    <div class="swatches" id="accents">
      <button type="button" class="sw" data-c="#1f5fbf" style="background:#1f5fbf" aria-label="Blau"></button>
      <button type="button" class="sw" data-c="#1f8a4c" style="background:#1f8a4c" aria-label="Grün"></button>
      <button type="button" class="sw" data-c="#d96b0b" style="background:#d96b0b" aria-label="Orange"></button>
      <button type="button" class="sw" data-c="#d23a3a" style="background:#d23a3a" aria-label="Rot"></button>
      <button type="button" class="sw" data-c="#7a4bd6" style="background:#7a4bd6" aria-label="Violett"></button>
      <button type="button" class="sw" data-c="#0f8b9e" style="background:#0f8b9e" aria-label="Türkis"></button>
      <button type="button" class="sw" data-c="#d63d85" style="background:#d63d85" aria-label="Pink"></button>
      <button type="button" class="sw" data-c="#4b5563" style="background:#4b5563" aria-label="Graphit"></button>
      <span class="sw" id="swc" style="background:conic-gradient(#e53935,#fdd835,#43a047,#00acc1,#3949ab,#d81b60,#e53935)"><input type="color" id="accentpick" value="#1f5fbf" aria-label="Eigene Farbe"></span>
    </div>
    <p class="cap">Hintergrund</p>
    <div class="seg" id="bgseg" style="grid-template-columns:repeat(4,1fr)"><button type="button" data-bg="std">Standard</button><button type="button" data-bg="warm">Warm</button><button type="button" data-bg="cool">Kühl</button><button type="button" data-bg="nature">Natur</button></div>
    <button class="sec" id="designreset" type="button">Zurücksetzen</button>
  </section>

  <p id="ver" data-tab="data" style="font-size:13px;color:var(--mute);margin:8px 4px"></p>
</div>

<div id="topbar"><svg id="logo" viewBox="0 0 1024 1024" role="img" aria-label="Krafttraining-Tracker"><rect width="1024" height="1024" rx="230" fill="#1f5fbf"/><g fill="#fff"><rect x="120" y="470" width="784" height="84" rx="40"/><rect x="250" y="250" width="100" height="524" rx="40"/><rect x="674" y="250" width="100" height="524" rx="40"/><rect x="385" y="330" width="70" height="364" rx="30"/><rect x="569" y="330" width="70" height="364" rx="30"/></g></svg><div id="tbact">
  <button id="langbtn" type="button" aria-label="Sprache wechseln"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span id="langtxt">DE</span></button>
  <button id="themebtn" type="button" aria-label="Zum dunklen Modus wechseln"><svg id="themeico" viewBox="0 0 24 24" aria-hidden="true"></svg></button></div>
</div>

<div id="toast" role="status" hidden></div>

<nav id="tabs" aria-label="Bereiche">
  <button data-go="train"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></span>Training</button>
  <button data-go="plans"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>Pläne</button>
  <button data-go="list"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg></span>Übungen</button>
  <button data-go="stats"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-9M12 20V5M19 20v-7"/></svg></span>Auswertung</button>
  <button data-go="data"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>Einstellungen</button>
</nav>

<div id="timer" hidden role="timer"><span>Pause</span><b id="tleft">1:30</b><button id="tadd">+15 s</button><button id="tstop">Stopp</button></div>

<script>
// ---- Sprache (Deutsch/Englisch) und Farbschema ----
var LANG = 'de', THEME = 'system', UNIT = 'kg', LBF = 2.20462;
try { UNIT = localStorage.getItem('krafttraining-unit') === 'lb' ? 'lb' : 'kg'; } catch (e) {}
function W(kg) { return UNIT === 'lb' ? Math.round(kg * LBF * 10) / 10 : kg; }
function toKg(v) { return UNIT === 'lb' ? Math.round(v / LBF * 1000) / 1000 : v; }
function applyUnit() {
  var st = UNIT === 'lb' ? 5 : 2.5;
  document.querySelector('#wlabel').textContent = 'Gewicht (' + UNIT + ')';
  document.querySelector('#wminus').dataset.step = 'kg:-' + st; document.querySelector('#wplus').dataset.step = 'kg:' + st;
  [].forEach.call(document.querySelectorAll('#unitseg button'), function (b) { b.classList.toggle('on', b.dataset.unit === UNIT); });
}

var ANIM = {"squat": {"label": "Kniebeuge", "bar": true, "decor": [], "a": {"h": [80, 10], "n": [80, 19], "p": [78, 48], "e": [68, 34], "w": [76, 22], "k": [80, 76], "f": [78, 108], "b": [77, 22]}, "b": {"h": [85, 48], "n": [80, 58], "p": [66, 86], "e": [70, 70], "w": [77, 60], "k": [96, 84], "f": [74, 108], "b": [77, 60]}}, "bench": {"label": "Bankdrücken", "bar": true, "decor": [[30, 84, 100, 84], [38, 84, 38, 108], [96, 84, 96, 108]], "a": {"h": [40, 76], "n": [50, 78], "p": [88, 78], "e": [51, 62], "w": [52, 46], "k": [110, 72], "f": [116, 104], "b": [52, 46]}, "b": {"h": [40, 76], "n": [50, 78], "p": [88, 78], "e": [62, 72], "w": [52, 66], "k": [110, 72], "f": [116, 104], "b": [52, 66]}}, "dead": {"label": "Kreuzheben", "bar": true, "decor": [], "a": {"h": [99, 52], "n": [92, 58], "p": [64, 76], "e": [88, 78], "w": [84, 99], "k": [92, 84], "f": [80, 108], "b": [84, 99]}, "b": {"h": [80, 10], "n": [80, 19], "p": [78, 48], "e": [81, 36], "w": [82, 52], "k": [80, 76], "f": [80, 108], "b": [82, 52]}}, "press": {"label": "Schulterdrücken", "bar": true, "decor": [], "a": {"h": [80, 10], "n": [80, 19], "p": [78, 48], "e": [74, 34], "w": [83, 20], "k": [80, 76], "f": [78, 108], "b": [83, 20]}, "b": {"h": [80, 10], "n": [80, 19], "p": [78, 48], "e": [81, 3], "w": [82, -13], "k": [80, 76], "f": [78, 108], "b": [82, -13]}}, "pull": {"label": "Klimmzüge", "bar": false, "decor": [[40, -20, 120, -20], [40, -20, 40, 108], [120, -20, 120, 108]], "a": {"h": [80, 5], "n": [80, 14], "p": [80, 44], "e": [80, -2], "w": [80, -20], "k": [80, 72], "f": [72, 96]}, "b": {"h": [81, -18], "n": [80, -8], "p": [80, 22], "e": [90, -6], "w": [80, -20], "k": [80, 50], "f": [72, 74]}}};
var ANIM_NAMES = { 'kniebeuge': 'squat', 'bankdrücken': 'bench', 'kreuzheben': 'dead', 'schulterdrücken': 'press', 'klimmzüge': 'pull' };
function animKey(ex) { return ANIM_NAMES[String(ex || '').toLowerCase()] || ''; }
function pt(a) { return a[0].toFixed(1) + ' ' + a[1].toFixed(1); }
function figSvg(key) {
  var a = ANIM[key], st = 'fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"';
  var ln = 'stroke="var(--line)" stroke-width="3" stroke-linecap="round"';
  var h = '<svg class="fig" data-fig="' + key + '" viewBox="0 -34 160 154" role="img" aria-label="Animation: ' + a.label + '">';
  h += '<line x1="10" y1="108" x2="150" y2="108" ' + ln + '/>';
  a.decor.forEach(function (l) { h += '<line x1="' + l[0] + '" y1="' + l[1] + '" x2="' + l[2] + '" y2="' + l[3] + '" ' + ln + '/>'; });
  h += '<path class="torso" ' + st + '/><path class="leg" ' + st + '/><path class="arm" ' + st + '/>';
  h += '<circle class="head" r="7" fill="var(--card)" stroke="var(--ink)" stroke-width="4"/>';
  if (a.bar) h += '<circle class="bar" r="9" fill="var(--plate)"/>';
  return h + '</svg>';
}
function lerp(p, q, u) { return [p[0] + (q[0] - p[0]) * u, p[1] + (q[1] - p[1]) * u]; }
function setPose(svg, u) {
  var a = ANIM[svg.dataset.fig], P = {};
  ['h', 'n', 'p', 'e', 'w', 'k', 'f', 'b'].forEach(function (k) { if (a.a[k]) P[k] = lerp(a.a[k], a.b[k], u); });
  svg.querySelector('.torso').setAttribute('d', 'M' + pt(P.n) + 'L' + pt(P.p));
  svg.querySelector('.leg').setAttribute('d', 'M' + pt(P.p) + 'L' + pt(P.k) + 'L' + pt(P.f));
  svg.querySelector('.arm').setAttribute('d', 'M' + pt(P.n) + 'L' + pt(P.e) + 'L' + pt(P.w));
  var hd = svg.querySelector('.head'); hd.setAttribute('cx', P.h[0]); hd.setAttribute('cy', P.h[1]);
  var b = svg.querySelector('.bar'); if (b && P.b) { b.setAttribute('cx', P.b[0]); b.setAttribute('cy', P.b[1]); }
}
var raf = null, t0 = performance.now();
var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function applyAll(u) { document.querySelectorAll('svg.fig').forEach(function (s) { setPose(s, u); }); }
function tick(now) {
  if (!document.querySelector('svg.fig')) { raf = null; return; }
  var x = 0.5 - 0.5 * Math.cos((now - t0) * 2 * Math.PI / 3200);
  applyAll(x * x * (3 - 2 * x));
  raf = requestAnimationFrame(tick);
}
function startAnim() {
  applyAll(0);
  if (!still && !raf && document.querySelector('svg.fig')) raf = requestAnimationFrame(tick);
}
function updatePreview() {
  var v = $('#exsel').value, key = adding ? '' : animKey(v);
  $('#preview').innerHTML = key ? figSvg(key) : '';
  startAnim();
}

function groups() {
  var map = {};
  entries.forEach(function (e) { (map[e.ex] = map[e.ex] || []).push(e); });
  return Object.keys(map).map(function (ex) {
    var asc = map[ex].slice().sort(function (a, b) { return a.date.localeCompare(b.date) || a.id - b.id; });
    var best = -Infinity;
    var marked = asc.map(function (e) { var pr = e.kg > best; best = Math.max(best, e.kg); return { id: e.id, kg: e.kg, reps: e.reps, date: e.date, note: e.note || '', pr: pr }; });
    var last = marked[marked.length - 1], prev = marked[marked.length - 2];
    var e1 = Math.max.apply(null, marked.map(function (e) { return e.reps === 1 ? e.kg : e.kg * (1 + e.reps / 30); }));
    var withG = asc.filter(function (e) { return cleanGrp(e.grp); });
    var grp = withG.length ? cleanGrp(withG[withG.length - 1].grp) : catalogGroup(ex);
    var rec = marked.slice(-12), kgs = rec.map(function (e) { return e.kg; });
    var min = Math.min.apply(null, kgs), max = Math.max.apply(null, kgs);
    var points = rec.length < 2 ? null : rec.map(function (e, i) {
      var x = i / (rec.length - 1) * 200;
      var y = max === min ? 20 : 36 - (e.kg - min) / (max - min) * 32;
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    return { ex: ex, grp: grp, e1: e1, last: last, pr: best, delta: prev ? last.kg - prev.kg : null, points: points, desc: marked.slice().reverse() };
  }).sort(function (a, b) { return b.last.date.localeCompare(a.last.date) || b.last.id - a.last.id; });
}

function renderGroupSelect(keep) {
  var h = '';
  GROUPS.forEach(function (g) { h += '<option value="' + g + '">' + g + '</option>'; });
  h += '<option value="">' + NONE + '</option>';
  $('#grp').innerHTML = h;
  $('#grp').value = keep;
}

// Dropdown: bereits benutzte Übungen der gewählten Muskelgruppe, darunter Vorschläge
function renderSelect(keep) {
  var g = $('#grp').value, sel = $('#exsel'), all = groups();
  var used = all.filter(function (x) { return x.grp === g; });
  var seen = {}; all.forEach(function (x) { seen[x.ex.toLowerCase()] = 1; });
  var sug = suggest(g, seen);
  var opts = '<option value="" disabled>Übung wählen</option>';
  used.forEach(function (x) { opts += '<option value="' + esc(x.ex) + '">' + esc(x.ex) + '</option>'; });
  if (sug.length) {
    opts += '<optgroup label="Vorschläge">' + sug.map(function (n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('') + '</optgroup>';
  }
  sel.innerHTML = opts;
  var ok = used.some(function (x) { return x.ex === keep; }) || sug.indexOf(keep) > -1;
  sel.value = ok ? keep : '';
  syncNew();
}
function syncNew() {
  $('#exnew').hidden = !adding;
  $('#exsel').disabled = adding;
  var pb = $('#plus'); pb.textContent = adding ? '×' : '+';
  pb.setAttribute('aria-label', adding ? 'Abbrechen' : 'Eigene Übung hinzufügen');
  updatePreview();
}
function currentEx() { return adding ? $('#exnew').value.trim() : $('#exsel').value; }

function card(g) {
  var isOpen = open === g.ex;
  var d = g.delta === null ? '' :
    '<span>Veränderung <b class="' + (g.delta > 0 ? 'up' : g.delta < 0 ? 'down' : '') + '">' + (g.delta > 0 ? '+' : '') + fmt(W(g.delta)) + ' ' + UNIT + '</b></span>';
  var spark = g.points ? '<svg class="spark" viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true"><polyline points="' + g.points + '" fill="none" stroke="var(--plate)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>' : '';
  var key = animKey(g.ex);
  var fig = isOpen && key ? '<div class="figwrap">' + figSvg(key) + '</div>' : '';
  var next = g.last.reps >= 8 ? fmt(W(g.last.kg) + (UNIT === 'lb' ? 5 : 2.5)) + ' ' + UNIT : fmt(W(g.last.kg)) + ' ' + UNIT + ' × ' + (g.last.reps + 1);
  var assign = '';
  var hist = !isOpen ? '' : '<ul class="hist">' + g.desc.map(function (e) {
    return '<li><span>' + day(e.date) + '</span><span>' + fmt(W(e.kg)) + ' ' + UNIT + ' × ' + e.reps + (e.note ? '<small>' + esc(e.note) + '</small>' : '') + '</span>' +
      (e.pr ? '<span class="dot" title="Neue Bestleistung"></span>' : '<span></span>') +
      '<span><button class="del" data-edit="' + e.id + '">Ändern</button><button class="del" data-del="' + e.id + '" aria-label="Satz vom ' + day(e.date) + ' löschen">Löschen</button></span></li>';
  }).join('') + '</ul>';
  return '<article class="card">' +
    '<button class="head" data-ex="' + esc(g.ex) + '" aria-expanded="' + isOpen + '">' +
    '<span class="name">' + esc(g.ex) + '</span>' +
    '<span class="last">Zuletzt ' + fmt(W(g.last.kg)) + ' ' + UNIT + ' × ' + g.last.reps + ' am ' + day(g.last.date) + '</span>' +
    '<span class="big">' + fmt(W(g.last.kg)) + '<small>' + UNIT + '</small></span></button>' +
    '<div class="meta"><span>Bestleistung <b>' + fmt(W(g.pr)) + ' ' + UNIT + '</b></span><span>Geschätztes Max <b>' + fmt(W(Math.round(g.e1 * 2) / 2)) + ' ' + UNIT + '</b></span>' + d + '<span>Nächstes Mal <b>' + next + '</b></span><button class="mini" data-again="' + esc(g.ex) + '">Gleicher Satz</button></div>' + spark + fig + assign + hist + '</article>';
}

function render() {
  $('#sub').textContent = entries.length + (entries.length === 1 ? ' Satz' : ' Sätze') + ' erfasst';
  renderPlans(); renderToday(); renderStats(); renderManage(); renderStatus();
  var gs = groups();
  if (!gs.length) { $('#list').innerHTML = '<p class="empty">Noch keine Einträge.</p>'; return; }
  pgGroups = GROUPS.concat(['']).filter(function (g) { return gs.some(function (x) { return x.grp === g; }); });
  if (pgGroups.indexOf(gKey) < 0) gKey = pgGroups[0];
  $('#list').innerHTML = '<div class="gtabs" id="gtabs">' + pgGroups.map(function (g, i) {
    return '<button type="button" data-gi="' + i + '"' + (g === gKey ? ' class="on"' : '') + '>' + (g || NONE) + ' <small>' + gs.filter(function (x) { return x.grp === g; }).length + '</small></button>';
  }).join('') + '</div><div class="pager" id="pager">' + pgGroups.map(function (g) {
    return '<div class="page">' + gs.filter(function (x) { return x.grp === g; }).map(card).join('') + '</div>';
  }).join('') + '</div>';
  $('#pager').addEventListener('scroll', onPgScroll);
  pgRestore();
  startAnim();
}
var gKey = null, pgGroups = [];
function pgStep() { var p = document.querySelector('#pager'); return p && p.children[1] ? p.children[1].offsetLeft - p.children[0].offsetLeft : (p ? p.clientWidth : 0); }
function pgFit() {
  var p = document.querySelector('#pager'); if (!p) return;
  var pg = p.children[Math.max(0, pgGroups.indexOf(gKey))];
  if (pg) p.style.height = pg.offsetHeight + 'px';
}
function pgRestore() {
  var p = document.querySelector('#pager'), w = pgStep();
  if (p && w) { p.style.scrollBehavior = 'auto'; p.scrollLeft = Math.max(0, pgGroups.indexOf(gKey)) * w; }
  pgFit();
}
function onPgScroll() {
  var p = document.querySelector('#pager'), w = pgStep(); if (!p || !w) return;
  var i = Math.max(0, Math.min(pgGroups.length - 1, Math.round(p.scrollLeft / w)));
  if (pgGroups[i] === gKey) return;
  gKey = pgGroups[i]; pgFit();
  var tabs = document.querySelector('#gtabs');
  [].forEach.call(tabs.children, function (b, k) {
    b.classList.toggle('on', k === i);
    if (k === i) tabs.scrollLeft = b.offsetLeft - (tabs.clientWidth - b.offsetWidth) / 2;
  });
}
document.querySelector('#list').addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-gi]'), p = document.querySelector('#pager'); if (!b || !p) return;
  p.style.scrollBehavior = ''; p.scrollTo({ left: Number(b.dataset.gi) * pgStep(), behavior: 'smooth' });
});

function valid() {
  var kg = $('#kg').value, reps = $('#reps').value;
  return currentEx() && kg !== '' && Number(kg) >= 0 && Number(reps) >= 1 && $('#date').value;
}
function check() { $('#save').disabled = !valid(); }

function prefill() {
  var ex = $('#exsel').value;
  var g = groups().filter(function (x) { return x.ex === ex; })[0];
  if (g) { $('#kg').value = W(g.last.kg); $('#reps').value = g.last.reps; }
  else { $('#kg').value = ''; $('#reps').value = ''; }
}

$('#plus').addEventListener('click', function () {
  adding = !adding;
  if (adding) { $('#exnew').value = ''; $('#kg').value = ''; $('#reps').value = ''; }
  syncNew();
  if (adding) $('#exnew').focus(); else prefill();
  check();
});
$('#grp').addEventListener('change', function () { renderSelect(''); prefill(); check(); });
$('#exsel').addEventListener('change', function () { syncNew(); prefill(); if (!$('#exnew').hidden) $('#exnew').focus(); check(); });
['#exnew', '#kg', '#reps', '#date'].forEach(function (s) { $(s).addEventListener('input', check); });

$('#save').addEventListener('click', function () {
  if (!valid()) return;
  var ex = currentEx();
  // Gleicher Name in anderer Schreibweise? Dann vorhandene Übung verwenden.
  var match = groups().filter(function (g) { return g.ex.toLowerCase() === ex.toLowerCase(); })[0];
  var grp = $('#grp').value;
  if (match) { ex = match.ex; grp = match.grp; }
  var before = snap();
  entries.push({ id: Date.now(), ex: ex, grp: grp, note: $('#note').value.trim(), kg: toKg(Number($('#kg').value)), reps: Number($('#reps').value), date: $('#date').value });
  save(); open = ex; gKey = grp; startRest(); levelUp(before);
  $('#note').value = '';
  $('#exnew').value = ''; adding = false;
  $('#grp').value = grp;
  renderSelect(ex);        // Übung bleibt ausgewählt, Werte bleiben für den nächsten Satz stehen
  $('#date').value = today();
  check(); render();
});

function rowAction(t) {
  if (t.dataset.again) {
    var g = groups().filter(function (x) { return x.ex === t.dataset.again; })[0];
    if (g) { var before = snap(); entries.push({ id: Date.now(), ex: g.ex, grp: g.grp, kg: g.last.kg, reps: g.last.reps, note: '', date: today() }); startRest(); levelUp(before); }
  } else if (t.dataset.edit) {
    var id = Number(t.dataset.edit), e = entries.filter(function (x) { return x.id === id; })[0];
    if (!e) return;
    var kg = prompt('Gewicht (' + UNIT + ')', W(e.kg)); if (kg === null) return;
    var reps = prompt('Wiederholungen', e.reps); if (reps === null) return;
    var note = prompt('Notiz', e.note || ''); if (note === null) return;
    kg = Number(String(kg).replace(',', '.')); reps = Number(reps);
    if (!(kg >= 0) || !(reps >= 1)) return;
    e.kg = toKg(kg); e.reps = reps; e.note = note.trim();
  } else if (t.dataset.rename) {
    var old = t.dataset.rename, nn = prompt('Neuer Name', old);
    if (!nn || !nn.trim()) return;
    nn = nn.trim();
    var m = groups().filter(function (x) { return x.ex.toLowerCase() === nn.toLowerCase() && x.ex !== old; })[0];
    if (m) nn = m.ex;
    entries.forEach(function (x) { if (x.ex === old) x.ex = nn; });
    if (open === old) open = nn;
    plans.forEach(function (p) { p.exs = p.exs.map(function (n) { return n === old ? nn : n; }); }); savePlans();
    customs.forEach(function (c) { if (c.ex === old) c.ex = nn; }); saveCustoms();
  }
  save(); renderSelect($('#exsel').value); render(); check();
}
$('#list').addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-edit],[data-rename],[data-again]');
  if (t) { rowAction(t); return; }
  var del = ev.target.closest('[data-del]');
  if (del) {
    var id = Number(del.dataset.del);
    entries = entries.filter(function (e) { return e.id !== id; });
    save(); renderSelect($('#exsel').value); render(); check(); return;
  }
  var head = ev.target.closest('[data-ex]');
  if (head) { open = open === head.dataset.ex ? null : head.dataset.ex; render(); }
});


// Sichern: bevorzugt über das iOS-Teilen-Menü (z. B. "In Dateien sichern"), sonst als Download
$('#export').addEventListener('click', function () {
  var name = 'krafttraining-' + today() + '.json';
  var blob = new Blob([JSON.stringify({ entries: entries, plans: plans, customs: customs, hidden: Object.keys(hiddenCat) }, null, 2)], { type: 'application/json' });
  var file; try { file = new File([blob], name, { type: 'application/json' }); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file] }).then(function () { say('Sicherung bereit.'); }).catch(function () {});
  } else {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    say('Sicherung heruntergeladen.');
  }
});
$('#import').addEventListener('click', function () { $('#file').click(); });
$('#file').addEventListener('change', function () {
  var f = this.files[0]; if (!f) return;
  var input = this, rd = new FileReader();
  rd.onload = function () {
    try {
      var data = JSON.parse(rd.result);
      var np = data && data.plans, nc = data && data.customs, nh = data && data.hidden;
      if (!Array.isArray(data)) data = data && data.entries;
      if (!Array.isArray(data)) throw 0;
      if (Array.isArray(np)) np.forEach(function (p) {
        if (p && p.name && Array.isArray(p.exs) && !plans.some(function (q) { return q.name === p.name; })) plans.push({ id: p.id || Date.now(), name: String(p.name), exs: p.exs.map(String), days: Array.isArray(p.days) ? p.days.map(Number) : [] });
      });
      savePlans();
      if (Array.isArray(nc)) nc.forEach(function (c) {
        if (c && typeof c.ex === 'string' && !customs.some(function (x) { return x.ex.toLowerCase() === c.ex.toLowerCase(); })) customs.push({ ex: c.ex, grp: cleanGrp(c.grp) });
      });
      saveCustoms();
      if (Array.isArray(nh)) { nh.forEach(function (h) { hiddenCat[String(h)] = 1; }); saveHidden(); }
      var ids = {}; entries.forEach(function (e) { ids[e.id] = 1; });
      var added = 0;
      data.forEach(function (e) {
        if (e && typeof e.ex === 'string' && isFinite(e.kg) && isFinite(e.reps) && typeof e.date === 'string' && !ids[e.id]) {
          entries.push({ id: e.id || Date.now() + added, ex: e.ex, grp: cleanGrp(e.grp), note: String(e.note || ''), kg: Number(e.kg), reps: Number(e.reps), date: e.date });
          ids[e.id] = 1; added++;
        }
      });
      save(); renderSelect($('#exsel').value); render(); check();
      say(added + (added === 1 ? ' Satz' : ' Sätze') + ' geladen.');
    } catch (e) { say('Die Datei konnte nicht gelesen werden. Wähle eine Sicherung aus diesem Tracker.'); }
    input.value = '';
  };
  rd.readAsText(f);
});

var REST = 90, restEnd = 0, restTimer = null, actx = null;
function beep() {
  try { var o = actx.createOscillator(); o.connect(actx.destination); o.frequency.value = 880; o.start(); o.stop(actx.currentTime + 0.4); } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate(300); } catch (e) {}
}
function showRest() {
  var left = Math.max(0, Math.ceil((restEnd - Date.now()) / 1000));
  $('#tleft').textContent = left ? Math.floor(left / 60) + ':' + ('0' + left % 60).slice(-2) : 'Los!';
  if (!left) { clearInterval(restTimer); restTimer = null; beep(); setTimeout(function () { if (!restTimer) $('#timer').hidden = true; }, 4000); }
}
function startRest() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
  restEnd = Date.now() + REST * 1000; $('#timer').hidden = false;
  clearInterval(restTimer); restTimer = setInterval(showRest, 250); showRest();
}
$('#tadd').addEventListener('click', function () {
  restEnd = Math.max(restEnd, Date.now()) + 15000;
  if (!restTimer) restTimer = setInterval(showRest, 250);
  showRest();
});
$('#tstop').addEventListener('click', function () { clearInterval(restTimer); restTimer = null; $('#timer').hidden = true; });


$('#csv').addEventListener('click', function () {
  var q = function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; };
  var gm = {}; groups().forEach(function (g) { gm[g.ex] = g.grp; });
  var rows = ['Datum;Muskelgruppe;Übung;Gewicht (kg);Wiederholungen;Notiz'];
  entries.slice().sort(function (a, b) { return a.date.localeCompare(b.date) || a.id - b.id; }).forEach(function (e) {
    rows.push([e.date, q(gm[e.ex] || NONE), q(e.ex), String(e.kg).replace('.', ','), e.reps, q(e.note || '')].join(';'));
  });
  var name = 'krafttraining-' + today() + '.csv';

    all.forEach(function (x) { seen[x.ex.toLowerCase()] = 1; });
    GROUPS.concat(['']).forEach(function (g) {
      var names = all.filter(function (x) { return x.grp === g; }).map(function (x) { return x.ex; });
      suggest(g, seen).forEach(function (n) { names.push(n); });
      if (!names.length) return;
      h += '<fieldset><legend>' + (g || NONE) + '</legend>' + names.map(function (n) {
        return '<label class="chk"><input type="checkbox" value="' + esc(n) + '"' + (pedit.exs.indexOf(n) > -1 ? ' checked' : '') + '> ' + esc(n) + '</label>';
      }).join('') + '</fieldset>';
    });
    box.innerHTML = h + '<div class="btns fbar"><button class="primary" id="psave">Plan speichern</button><button class="sec" id="pcancel">Abbrechen</button></div>';
    return;
  }
  var m = dayMap(), t = today();
  if (!selDay) selDay = t;
  var ds = plShowAll ? t : selDay;
  var card = function (p) {
    var d = m[ds] || {};
    var chips = p.exs.map(function (n) {
      return '<button class="chip' + (d[n] ? ' done' : '') + '" data-pex="' + esc(n) + '">' + (d[n] ? '✓ ' : '') + esc(n) + '</button>';
    }).join('');
    return '<article class="card plan"><h3>' + esc(p.name) + '</h3><div class="last" style="padding:0 14px 8px">' + planInfo(p, m) + '</div><div class="chips">' + (chips || '<span class="last">Keine Übungen</span>') +
      '</div><div class="acts"><button class="mini" data-pedit="' + p.id + '">Bearbeiten</button><button class="mini" data-pdel="' + p.id + '">Löschen</button></div></article>';
  };
  var h = renderWeek(m) + '<div class="ptop"><button class="sec" id="newplan">+ Neuer Plan</button><button class="sec' + (plShowAll ? ' on' : '') + '" id="plall" aria-pressed="' + plShowAll + '">' + (plShowAll ? 'Tag anzeigen' : 'Alle anzeigen') + '</button></div>';
  if (plIdx >= plans.length) plIdx = 0;
  if (plShowAll) {
    h += plans.length
      ? '<div class="carousel" id="plcar">' + plans.map(card).join('') + '</div><div class="dots" id="pldots">' +
        plans.map(function (p, i) { return '<button type="button" data-pi="' + i + '" aria-label="' + esc(p.name) + '"' + (i === plIdx ? ' class="on"' : '') + '></button>'; }).join('') + '</div>'
      : '<p>Noch kein Plan. Tippe auf „+ Neuer Plan“ um einen Plan zu erstellen.</p>';
  } else {
    var wd = wdx(selDay), sched = plans.filter(function (p) { return (p.days || []).indexOf(wd) > -1; });
    h += dayDetail(selDay, m, planned()) +
      (sched.length ? sched.map(card).join('') : '<p>' + (plans.length ? 'Für diesen Tag ist kein Plan eingeplant.' : 'Noch kein Plan. Tippe auf „+ Neuer Plan“ um einen Plan zu erstellen.') + '</p>');
  }
  box.innerHTML = h + renderLog(m);
  var pc = document.querySelector('#plcar');
  if (pc) { pc.addEventListener('scroll', onPlScroll); plRestore(); }
}
var plShowAll = false, plIdx = 0;
function plStep() { var c = document.querySelector('#plcar'); return c && c.children[1] ? c.children[1].offsetLeft - c.children[0].offsetLeft : (c ? c.clientWidth : 0); }
function plRestore() { var c = document.querySelector('#plcar'), w = plStep(); if (c && w) { c.style.scrollBehavior = 'auto'; c.scrollLeft = plIdx * w; } }
function onPlScroll() {
  var c = document.querySelector('#plcar'), w = plStep(); if (!c || !w) return;
  var i = Math.max(0, Math.min(plans.length - 1, Math.round(c.scrollLeft / w)));
  if (i === plIdx) return;
  plIdx = i;
  [].forEach.call(document.querySelectorAll('#pldots button'), function (b) { b.classList.toggle('on', Number(b.dataset.pi) === i); });
}
$('#plansbox').addEventListener('click', function (ev) {
  var dc = ev.target.closest('[data-day]');
  if (dc) { selDay = dc.dataset.day; plShowAll = false; renderPlans(); return; }
  var pd = ev.target.closest('[data-pi]'), pcar = document.querySelector('#plcar');
  if (pd && pcar) { pcar.style.scrollBehavior = ''; pcar.scrollTo({ left: Number(pd.dataset.pi) * plStep(), behavior: 'smooth' }); return; }
  var b = ev.target.closest('button'); if (!b) return;
  var box = $('#plansbox');
  if (b.dataset.pex) { pickEx(b.dataset.pex); return; }
  if (b.id === 'newplan') { pedit = { id: 0, name: '', exs: [], days: [] }; box.innerHTML = ''; }
  else if (b.dataset.pedit) {
    var p = plans.filter(function (x) { return x.id === Number(b.dataset.pedit); })[0];
    if (!p) return; pedit = { id: p.id, name: p.name, exs: p.exs.slice(), days: (p.days || []).slice() }; box.innerHTML = '';
  }
  else if (b.dataset.pdel) {
    if (!confirm('Plan löschen? Deine Sätze bleiben erhalten.')) return;
    plans = plans.filter(function (x) { return x.id !== Number(b.dataset.pdel); }); savePlans();
  }
  else if (b.id === 'psave') {
    var exs = [].map.call(box.querySelectorAll('input[type=checkbox]:not(.wdc):checked'), function (c) { return c.value; });
    var days = [].map.call(box.querySelectorAll('.wdc:checked'), function (c) { return Number(c.value); });
    var name = $('#pname').value.trim() || 'Plan ' + (plans.length + 1);
    if (pedit.id) plans.forEach(function (x) { if (x.id === pedit.id) { x.name = name; x.exs = exs; x.days = days; } });
    else plans.push({ id: Date.now(), name: name, exs: exs, days: days });
    savePlans(); pedit = null;
  }
  else if (b.id === 'pplus') { syncEdit(); pedit.adding = !pedit.adding; box.innerHTML = ''; }
  else if (b.id === 'paddex') {
    syncEdit();
    var nm = $('#pnewex').value.trim();
    if (nm) {
      var ex0 = knownEx(nm);
      if (!ex0) { customs.push({ ex: nm, grp: pedit.agrp }); saveCustoms(); ex0 = nm; }
      if (pedit.exs.indexOf(ex0) < 0) pedit.exs.push(ex0);
    }
    box.innerHTML = '';
  }
  else if (b.id === 'plall') { plShowAll = !plShowAll; }
  else if (b.id === 'pcancel') { pedit = null; }
  else return;
  renderPlans(); renderToday(); renderSelect($('#exsel').value);
});

function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function weekStart(s) { var d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); }
function renderStats() {
  var box = $('#statbox'), wk = Number($('#per').dataset.v);
  if (!entries.length) { box.innerHTML = '<p>Noch keine Daten.</p>'; return; }
  var weeks = wk || 12, d0 = new Date(weekStart(today()) + 'T00:00:00'), keys = [];
  for (var i = weeks - 1; i >= 0; i--) { var d = new Date(d0); d.setDate(d.getDate() - i * 7); keys.push(iso(d)); }
  var cut = wk ? keys[0] : '', gs = groups(), gm = {};
  gs.forEach(function (g) { gm[g.ex] = g.grp; });
  var inp = entries.filter(function (e) { return e.date >= cut; });
  var vol = 0, days = {}, byG = {}, byW = {};
  inp.forEach(function (e) {
    var v = e.kg * e.reps, g = gm[e.ex] || '', w = weekStart(e.date);
    vol += v; days[e.date] = 1; byG[g] = (byG[g] || 0) + v; byW[w] = (byW[w] || 0) + v;
  });
  var prs = 0;
  gs.forEach(function (g) { g.desc.forEach(function (e, i) { if (e.pr && i < g.desc.length - 1 && e.date >= cut) prs++; }); });
  var vals = keys.map(function (k) { return byW[k] || 0; }), max = Math.max.apply(null, vals);
  var h = '<div class="kpis">' + [[Object.keys(days).length, 'Trainingstage'], [inp.length, 'Sätze'], [fmt(Math.round(W(vol))), 'Volumen (' + UNIT + ')'], [prs, 'Bestleistungen']]
    .map(function (k) { return '<div><b>' + k[0] + '</b><span>' + k[1] + '</span></div>'; }).join('') + '</div>';
  if (max > 0) {
    var bw = 200 / keys.length;
    h += '<p class="cap">Volumen pro Woche (älteste links), Spitze ' + fmt(Math.round(W(max))) + ' ' + UNIT + '</p><svg class="wk" viewBox="0 0 200 64" preserveAspectRatio="none" aria-hidden="true">' +
      vals.map(function (v, i) {
        var hh = Math.max(v / max * 60, v ? 2 : 0.8);
        return '<rect x="' + (i * bw + 1).toFixed(1) + '" y="' + (62 - hh).toFixed(1) + '" width="' + Math.max(bw - 2, 1).toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="1.5" fill="var(--plate)" opacity="' + (v ? 1 : 0.25) + '"/>';
      }).join('') + '</svg>';
  }
  var gk = Object.keys(byG).sort(function (a, b) { return byG[b] - byG[a]; });
  if (gk.length && byG[gk[0]] > 0) {
    h += '<p class="cap">Volumen je Muskelgruppe</p>' + gk.map(function (k) {
      return '<div class="gbar"><span>' + (k || NONE) + '</span><i style="width:' + (byG[k] / byG[gk[0]] * 100).toFixed(0) + '%"></i><em>' + fmt(Math.round(W(byG[k]))) + ' ' + UNIT + '</em></div>';
    }).join('');
  }
  box.innerHTML = h;
}
$('#per').addEventListener('click', function (ev) {
  var b = ev.target.closest('button'); if (!b) return;
  this.dataset.v = b.dataset.v;
  [].forEach.call(this.children, function (c) { c.classList.toggle('on', c === b); });
  renderStats();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}

$('#date').value = today();
var first = groups()[0];
var tb = 'train'; try { tb = localStorage.getItem('krafttraining-tab') || 'train'; } catch (e) {}
go(['train', 'plans', 'list', 'stats', 'data'].indexOf(tb) > -1 ? tb : 'train');
renderGroupSelect(first ? first.grp : GROUPS[0]);
renderSelect('');
render();
check();
applyUnit();
startI18n();
</script>
